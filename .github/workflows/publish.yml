name: publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run without publishing or creating a release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package versions
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a release tag"
            exit 1
          fi
          for manifest in packages/*/package.json packages/@stylexjs/*/package.json; do
            if ! jq -e --arg v "$TAG" '.private == true or .version == $v' "$manifest" > /dev/null; then
              echo "::error file=$manifest::version does not match tag $TAG"
              exit 1
            fi
          done
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'yarn'
          cache-dependency-path: yarn.lock
      - run: corepack prepare yarn@1.22.22 --activate
      - run: npm install -g 'npm@^11.5.1'
      - run: yarn install --frozen-lockfile
      - name: Publish to npm
        run: |
          node tools/npm/release.js --pkg-version "$TAG" --skip-install \
            --publish --dry-run="$DRY_RUN"
      - name: Create GitHub release
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
