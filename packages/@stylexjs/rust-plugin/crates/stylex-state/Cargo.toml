[package]
description = "The per-file StyleX compilation state and the value vocabulary it composes"
edition.workspace = true
license.workspace = true
name = "stylex_state"
repository.workspace = true
rust-version.workspace = true
version.workspace = true


[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
path-clean.workspace = true
anyhow.workspace = true
indexmap.workspace = true
log.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
swc_core = { workspace = true, features = [
  "common",
  "ecma_ast",
  "ecma_codegen",
  "ecma_visit",
] }
swc_sourcemap.workspace = true

stylex_ast = { path = "../stylex-ast" }
stylex_constants = { path = "../stylex-constants" }
stylex_diagnostics = { path = "../stylex-diagnostics" }
stylex_enums = { path = "../stylex-enums" }
stylex_js = { path = "../stylex-js" }
stylex_macros = { path = "../stylex-macros" }
stylex_path_resolver = { path = "../stylex-path-resolver" }
stylex_state_index = { path = "../stylex-state-index" }
stylex_structures = { path = "../stylex-structures" }
stylex_styleq = { path = "../stylex-styleq" }
stylex_types = { path = "../stylex-types" }
stylex_utils = { path = "../stylex-utils" }

[dev-dependencies]
criterion.workspace = true
ctor.workspace = true
path-clean.workspace = true
pretty_env_logger.workspace = true
stacker.workspace = true
swc_core = { workspace = true, features = ["ecma_parser"] }
swc_malloc.workspace = true



[lints]
workspace = true
