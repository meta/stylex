[package]
description = "JavaScript runtime helpers for the StyleX compiler plugin"
edition.workspace = true
license.workspace = true
name = "stylex_js"
repository.workspace = true
rust-version.workspace = true
version.workspace = true


[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
icu_normalizer.workspace = true
indexmap.workspace = true
ryu-js = "1.0.2"
swc_core = { workspace = true, features = ["common", "ecma_ast", "swc_atoms"] }

stylex_constants = { path = "../stylex-constants" }
stylex_macros = { path = "../stylex-macros" }
stylex_utils = { path = "../stylex-utils" }

[dev-dependencies]

[lints]
workspace = true
